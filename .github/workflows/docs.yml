# Docs site (mkdocs-material, strict). Pull requests build only; main publishes to GitHub Pages
# together with a freshly generated sample signed report from the localhost lab.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_MKDOCS_2_WARNING: '1'

jobs:
  build:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[docs,capture,server]"
      - name: mkdocs build --strict
        run: mkdocs build --strict --site-dir site
      - name: Sample signed report from the lab
        if: github.event_name != 'pull_request'
        run: |
          python -m playwright install --with-deps chromium
          python scripts/sample_report.py site/sample-report
          python -m blink_visual verify-report site/sample-report/report.json \
            --public-key site/sample-report/ledger_ed25519.pub
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
