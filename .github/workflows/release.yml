# Release on a version tag (v2.0.0, ...): sdist + wheel, CycloneDX SBOM, pip-audit report, a
# GitHub release with those files, and the container image on GHCR.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v2.0.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  python:
    name: Build, SBOM and audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check the tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$TAG" || { echo "::error::tag $TAG does not match version $version"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Install the wheel with every runtime extra
        run: |
          python -m venv /tmp/release-env
          # The venv's bundled pip is older than the current release and has known advisories;
          # upgrade it so the SBOM and audit describe the environment users actually get.
          /tmp/release-env/bin/python -m pip install --disable-pip-version-check --upgrade pip
          /tmp/release-env/bin/pip install --disable-pip-version-check "$(ls dist/*.whl)[capture,server]"
          /tmp/release-env/bin/blink --version
      - name: CycloneDX SBOM
        run: |
          python -m pip install --disable-pip-version-check cyclonedx-bom
          cyclonedx-py environment --output-format JSON --output-file "dist/blink-${TAG}.cdx.json" /tmp/release-env/bin/python
      - name: pip-audit report
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit --path "$(/tmp/release-env/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')" \
            --format json --output "dist/pip-audit-${TAG}.json"
          pip-audit --path "$(/tmp/release-env/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Blink $TAG" --generate-notes --verify-tag
          fi

  image:
    name: Container image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
