name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install ".[dev,ui]"
      - run: python -m pytest -q
      - run: python examples/smoke.py
      - run: python examples/scientific_smoke.py
      - run: blink --version
      - run: blink compare outputs/bl02/before.png outputs/bl02/after.png --fail-above 2 --output-dir outputs/bl04
      - run: python -m blink_visual compare outputs/bl02/before.png outputs/bl02/after.png --json
