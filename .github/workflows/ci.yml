name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev,capture,server]"
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: mypy (strict, new code)
        run: mypy src/blink_visual --exclude 'src/blink_visual/(compare|analysis|render|workspace|cli)\.py'
      - name: bandit
        run: bandit -q -r src
      - name: pip-audit
        run: pip-audit

  test:
    name: Tests / Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,ui,capture,server]"
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Skip browser tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "BLINK_SKIP_BROWSER=1" >> "$GITHUB_ENV"
      - run: python -m pytest -q --cov=src/blink_visual --cov-report=term-missing
      - run: python examples/smoke.py
      - run: python examples/scientific_smoke.py
      - run: blink --version
      - run: blink compare outputs/bl02/before.png outputs/bl02/after.png --fail-above 2 --output-dir outputs/bl04
      - run: python -m blink_visual compare outputs/bl02/before.png outputs/bl02/after.png --json
