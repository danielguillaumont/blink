# Publish blink-checkout to TestPyPI and PyPI with Trusted Publishing (OIDC, no API tokens).
#
# The dry run always runs. The publish jobs are gated by repository variables, so until the
# PyPI side is set up (docs/releasing.md) they are skipped and a release tag still ends green:
#   TESTPYPI_PUBLISH = true  -> publish to TestPyPI, then pipx-install from it
#   PYPI_PUBLISH     = true  -> publish to PyPI on a version tag push
name: PyPI

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v2.1.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check the tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$TAG" || { echo "::error::tag $TAG does not match version $version"; exit 1; }
      - name: Build and check
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  dry-run:
    name: Dry run (clean pipx install of the built wheel)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-dist
          path: dist/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: pipx install with [capture,server]
        run: |
          wheel=$(ls dist/*.whl)
          case "$wheel" in */blink_checkout-*) ;; *) echo "::error::unexpected wheel name $wheel"; exit 1 ;; esac
          pipx install --python python3.12 "${wheel}[capture,server]"
          blink --version
          cd "$(mktemp -d)" && blink doctor --no-browser

  testpypi:
    name: Publish to TestPyPI
    needs: dry-run
    if: vars.TESTPYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/blink-checkout
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  testpypi-install:
    name: Clean install from TestPyPI
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: pipx install from TestPyPI (dependencies from PyPI)
        run: |
          version="${TAG#v}"
          for attempt in 1 2 3 4 5 6; do
            pipx install --python python3.12 \
              --pip-args "--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/" \
              "blink-checkout[capture,server]==${version}" && break
            echo "not yet visible on the TestPyPI index; retrying in 20s"; sleep 20
          done
          blink --version | grep -F "$version"

  pypi:
    name: Publish to PyPI
    needs: dry-run
    if: vars.PYPI_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/blink-checkout
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
