name: Blink payment page scan
description: >-
  Scan a payment page you own (for example a staging deployment) for script, header, CSP, form
  and visual changes (PCI DSS 6.4.3 / 11.6.1), gate on severity and upload the evidence.
author: danielguillaumont
branding:
  icon: eye
  color: blue

inputs:
  url:
    description: >-
      Payment page URL to scan, used only when the config file does not exist (Blink creates
      a minimal one). Only scan sites you are authorized to test.
    required: false
    default: ''
  config:
    description: Path to blink.yaml (committed, with your inventory next to it).
    required: false
    default: blink.yaml
  fail-on:
    description: 'Fail the step on findings at or above this severity: critical, high, medium, low, info or none.'
    required: false
    default: high
  store-cache:
    description: >-
      Keep the .blink store (baselines, history, ledger key) in the Actions cache between runs,
      so each scan compares with the last baseline instead of a fresh one. The cache holds the
      ledger signing key; anyone who can run workflows in this repository can read it.
    required: false
    default: 'true'
  evidence-name:
    description: Name of the uploaded evidence artifact.
    required: false
    default: blink-evidence
  python-version:
    description: Python version to run Blink with.
    required: false
    default: '3.12'

outputs:
  exit-code:
    description: 'Exit code of blink scan: 0 passed, 1 findings at or above fail-on, 2 config error, 3 capture failed.'
    value: ${{ steps.scan.outputs.exit-code }}
  findings:
    description: Number of findings in this scan.
    value: ${{ steps.scan.outputs.findings }}
  evidence-dir:
    description: Directory holding scan.json and the signed report.
    value: ${{ steps.paths.outputs.evidence }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Blink and Chromium
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check "${GITHUB_ACTION_PATH}[capture]"
        if [ "${RUNNER_OS}" = "Linux" ]; then
          python -m playwright install --with-deps chromium
        else
          python -m playwright install chromium
        fi

    - name: Prepare configuration
      id: paths
      shell: bash
      env:
        BLINK_URL: ${{ inputs.url }}
        BLINK_CONFIG_PATH: ${{ inputs.config }}
      run: |
        if [ ! -f "$BLINK_CONFIG_PATH" ]; then
          if [ -z "$BLINK_URL" ]; then
            echo "::error::$BLINK_CONFIG_PATH does not exist and no url input was given"
            exit 2
          fi
          blink init -c "$BLINK_CONFIG_PATH" --url "$BLINK_URL" --name staging
        fi
        store=$(python -c 'import sys; from blink_visual.project import Project; print(Project.load(sys.argv[1]).store_dir)' "$BLINK_CONFIG_PATH")
        echo "store=$store" >> "$GITHUB_OUTPUT"
        echo "evidence=${RUNNER_TEMP}/blink-evidence" >> "$GITHUB_OUTPUT"
        mkdir -p "${RUNNER_TEMP}/blink-evidence"

    - name: Restore the Blink store
      if: inputs.store-cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.paths.outputs.store }}
        key: blink-store-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          blink-store-${{ runner.os }}-${{ github.ref_name }}-
          blink-store-${{ runner.os }}-

    - name: Record a baseline where none exists
      shell: bash
      env:
        BLINK_CONFIG_PATH: ${{ inputs.config }}
      run: blink baseline -c "$BLINK_CONFIG_PATH" --if-missing --reason "GitHub Action ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}"

    - name: Scan
      id: scan
      shell: bash
      env:
        BLINK_CONFIG_PATH: ${{ inputs.config }}
        BLINK_FAIL_ON: ${{ inputs.fail-on }}
        EVIDENCE: ${{ steps.paths.outputs.evidence }}
      run: |
        set +e
        blink scan -c "$BLINK_CONFIG_PATH" --fail-on "$BLINK_FAIL_ON" --json > "$EVIDENCE/scan.json"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        findings=$(python -c 'import json, sys; print(len(json.load(open(sys.argv[1]))["findings"]))' "$EVIDENCE/scan.json" 2>/dev/null || echo 0)
        echo "findings=$findings" >> "$GITHUB_OUTPUT"
        python - "$EVIDENCE/scan.json" <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
        import json, sys
        report = json.load(open(sys.argv[1]))
        print("### Blink scan\n")
        print("| Severity | Finding | Target |\n|---|---|---|")
        for f in report["findings"]:
            print(f"| {f['severity']} | {f['title']} | {f['target']} [{f['profile']}] |")
        if not report["findings"]:
            print("| - | no findings | |")
        PY

    - name: Signed evidence report
      if: always() && steps.scan.outcome == 'success'
      shell: bash
      env:
        BLINK_CONFIG_PATH: ${{ inputs.config }}
        EVIDENCE: ${{ steps.paths.outputs.evidence }}
      run: blink report -c "$BLINK_CONFIG_PATH" --out "$EVIDENCE/report" --days 30 || echo "::warning::blink report exited $?"

    - name: Save the Blink store
      if: always() && inputs.store-cache == 'true' && steps.paths.outputs.store != ''
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.paths.outputs.store }}
        key: blink-store-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Upload evidence
      if: always() && steps.paths.outputs.evidence != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.evidence-name }}
        path: ${{ steps.paths.outputs.evidence }}
        if-no-files-found: warn

    - name: Gate
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
        BLINK_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        case "$CODE" in
          0) echo "Blink gate passed (fail-on: $BLINK_FAIL_ON)" ;;
          1) echo "::error::Blink found changes at or above '$BLINK_FAIL_ON'; see the evidence artifact"; exit 1 ;;
          3) echo "::error::Blink could not capture the page; see docs/runbooks/troubleshooting-capture.md"; exit 3 ;;
          *) echo "::error::blink scan failed with exit code $CODE"; exit "$CODE" ;;
        esac
