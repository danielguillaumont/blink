[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blink-visual"
version = "0.1.0"
description = "Local-first numerical image comparison toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<3", "Pillow>=10.3", "scipy>=1.11,<2", "scikit-image>=0.22,<1"]

[project.scripts]
blink = "blink_visual.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ui = ["streamlit>=1.67,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
